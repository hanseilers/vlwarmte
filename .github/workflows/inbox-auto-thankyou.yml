name: Inbox auto thank-you (manual)

on:
  workflow_dispatch:
    inputs:
      include_e2e:
        description: "Ook bedankmail voor VLW-E2E-testsubmissions (Formspree E2E)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  thank-you:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process unread leads
        env:
          IMAP_HOST: ${{ secrets.IMAP_HOST }}
          IMAP_PORT: ${{ secrets.IMAP_PORT }}
          IMAP_USER: ${{ secrets.IMAP_USER }}
          IMAP_PASSWORD: ${{ secrets.IMAP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          set -e
          EXTRA=""
          if [ "${{ inputs.include_e2e }}" = "true" ]; then EXTRA="--include-e2e"; fi
          python scripts/inbox_auto_thankyou.py --max 5 $EXTRA
